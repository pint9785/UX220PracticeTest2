<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        label, textarea{
            display: block;
            margin-bottom: 1em;
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <form>
        <label>First Name: <input name="first" type="text" /></label>

        <label>Phone Number: <input name="phone number" type="phone number" /></label>
        <label>Comments: <textarea name="comments"></textarea></label>
        <button type="submit">Send</button>
    </form>
</body>
</html>
